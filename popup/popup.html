<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tab Discarder</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <div class="brand">
          <img class="brand-icon" src="../icons/icon48.png" alt="" />
          <div>
            <h1>Tab Discarder</h1>
            <p id="tabSummary" class="tab-summary" aria-live="polite">
              Loading tab summary…
            </p>
          </div>
        </div>
        <button
          id="openOptions"
          class="icon-button"
          type="button"
          aria-label="Open settings"
          title="Open settings"
        >
          <span aria-hidden="true">⚙</span>
        </button>
      </header>

      <section class="search-section" aria-label="Search tabs">
        <label class="visually-hidden" for="tabSearch">Search tabs</label>
        <input
          id="tabSearch"
          type="search"
          placeholder="Search tabs..."
          aria-describedby="searchHint"
        />
        <p id="searchHint" class="visually-hidden">
          Filter tabs in this window by title or address.
        </p>
      </section>

      <section class="content-section quick-actions" aria-labelledby="quickActionsTitle">
        <div class="section-heading">
          <h2 id="quickActionsTitle">Quick actions</h2>
        </div>
        <div class="quick-action-list">
          <button id="sleepOtherTabs" type="button">Discard other tabs</button>
          <button id="sleepThisWindow" type="button">Discard this window</button>
          <button id="sleepThisGroup" type="button" hidden>
            Discard this group
          </button>
        </div>
        <p id="bulkActionStatus" class="availability-note" role="status" aria-live="polite">
          Window discard actions skip protected tabs.
        </p>
      </section>

      <section id="recentlyAwakenedSection" class="content-section" hidden>
        <div class="section-heading">
          <h2>Recently awakened</h2>
        </div>
        <ul
          id="recentlyAwakenedList"
          class="recent-awakened-list"
          aria-label="Recently awakened tabs"
        ></ul>
      </section>

      <section id="groupsSection" class="content-section" hidden>
        <div class="section-heading">
          <h2>Groups</h2>
        </div>
        <ul id="groupsList" class="group-list" aria-label="Tab groups in this window"></ul>
      </section>

      <section class="content-section window-section" aria-labelledby="thisWindowTitle">
        <div class="section-heading">
          <h2 id="thisWindowTitle">This window</h2>
        </div>
        <ul id="tabList" class="tab-list" aria-label="Tabs in this window"></ul>
      </section>

      <footer class="popup-footer">
        <span>Save memory. A faster, calmer browser.</span>
      </footer>
    </main>

    <script src="../lib/storage.js"></script>
    <script src="../lib/theme.js"></script>
    <script src="../lib/tab-state.js"></script>
    <script src="../lib/tab-filter.js"></script>
    <script src="../lib/discard-service.js"></script>
    <script src="../lib/recent-awakened-state.js"></script>
    <script src="tab-list.js"></script>
    <script src="recent-awakened-list.js"></script>
    <script src="group-list.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
